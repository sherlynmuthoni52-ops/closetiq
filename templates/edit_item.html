{% extends "base.html" %}
{% block title %}Edit Item{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">
            <div class="card-body p-4">

                <h3 class="mb-4">Edit Item</h3>

                <form method="POST"
                      action="{{ url_for('inventory.edit_item', item_id=item['id']) }}"
                      enctype="multipart/form-data">

                    <!-- Pre-filled with existing values using value="{{ item['...'] }}" -->

                    <div class="mb-3">
                        <label class="form-label">Item Name *</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ item['name'] }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category *</label>
                        <select name="category" class="form-select" required>
                            {% for cat in ["Tops", "Bottoms", "Footwear", "Accessories"] %}
                            <option value="{{ cat }}"
                                {% if item['category'] == cat %}selected{% endif %}>
                                {{ cat }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Color</label>
                        <input type="text" name="color" class="form-control"
                               value="{{ item['color'] or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Size</label>
                        <input type="text" name="size" class="form-control"
                               value="{{ item['size'] or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Best Season</label>
                        <select name="season" class="form-select">
                            {% for s in ["All", "Summer", "Winter", "Spring", "Autumn"] %}
                            <option value="{{ s }}"
                                {% if item['season'] == s %}selected{% endif %}>
                                {{ s }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Show current image if it exists -->
                    {% if item['image_path'] %}
                    <div class="mb-3">
                        <label class="form-label">Current Photo</label><br>
                        <img src="{{ url_for('static', filename='uploads/' + item['image_path']) }}"
                             style="height: 100px; object-fit: cover; border-radius: 8px;">
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">
                            {% if item['image_path'] %}Replace Photo{% else %}Add Photo{% endif %}
                        </label>
                        <input type="file" name="image" class="form-control"
                               accept=".png,.jpg,.jpeg,.gif">
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-dark">
                            Save Changes
                        </button>
                        <a href="{{ url_for('inventory.view_inventory') }}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
